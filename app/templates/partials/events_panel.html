<aside class="events-panel" aria-label="Upcoming events">
  <div class="events-card">
    <h2>Upcoming events</h2>
    <ul>
      {% for e in upcoming_events %}
      <li>
        <div class="ev-title">{{ e.title }}</div>
        <div class="ev-meta"><span class="k">Date</span><span class="v">{{ e.date_label }}</span></div>
        {% if e.time %}<div class="ev-meta"><span class="k">Time</span><span class="v">{{ e.time }}</span></div>{% endif %}
        {% if e.location %}<div class="ev-meta"><span class="k">Location</span><span class="v">{{ e.location }}</span></div>{% endif %}
        {% if e.link %}<div class="ev-meta"><span class="k">Link</span><span class="v"><a href="{{ e.link }}" target="_blank" rel="noopener noreferrer">More info</a></span></div>{% endif %}
      </li>
      {% endfor %}
    </ul>
  </div>
</aside>
