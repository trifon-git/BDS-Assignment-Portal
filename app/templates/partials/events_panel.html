<aside class="events-panel" aria-label="Upcoming events">
  <div class="events-card">
    <h2>Upcoming events</h2>
    <ul>
      {% for e in upcoming_events %}
      <li>
        <div class="ev-title">{{ e.title }}</div>
        <div class="ev-meta"><span>Date</span> {{ e.date_label }}</div>
        {% if e.time %}<div class="ev-meta"><span>Time</span> {{ e.time }}</div>{% endif %}
        {% if e.location %}<div class="ev-meta"><span>Location</span> {{ e.location }}</div>{% endif %}
        {% if e.link %}<div class="ev-meta"><span>Link</span> <a href="{{ e.link }}" target="_blank" rel="noopener noreferrer">More info</a></div>{% endif %}
      </li>
      {% endfor %}
    </ul>
  </div>
</aside>
